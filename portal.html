<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remote Typer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #d9dce1;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --ok: #15803d;
    --err: #b91c1c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #16181d;
      --card: #1f2228;
      --text: #e8eaed;
      --muted: #9aa0a8;
      --border: #33373f;
      --accent: #3b82f6;
      --accent-text: #ffffff;
      --ok: #4ade80;
      --err: #f87171;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 560px; }
  h1 { font-size: 1.25rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.85rem; margin: 0 0 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .card h2 {
    font-size: 0.8rem;
    text-transform: uppercase;
    letter-spacing: 0.04em;
    color: var(--muted);
    margin: 0 0 10px;
  }
  label { display: block; font-size: 0.85rem; margin-bottom: 4px; color: var(--muted); }
  input[type=text], input[type=password], textarea {
    width: 100%;
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 0.95rem;
    font-family: inherit;
    margin-bottom: 10px;
  }
  textarea { min-height: 220px; resize: vertical; line-height: 1.4; }
  button {
    width: 100%;
    background: var(--accent);
    color: var(--accent-text);
    border: none;
    border-radius: 8px;
    padding: 12px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }
  button.secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
    font-weight: 500;
    font-size: 0.85rem;
    width: auto;
    padding: 8px 14px;
  }
  .row { display: flex; justify-content: space-between; align-items: center; }
  #status { min-height: 1.2em; font-size: 0.85rem; margin-top: 10px; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--err); }
  #settingsCard[hidden], #sendCard[hidden], #receiveCard[hidden] { display: none; }
  .settingsToggle { text-align: right; margin-bottom: 8px; }
  .modeRow { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; font-size: 0.9rem; }
  .modeRow label { display: flex; align-items: center; gap: 6px; margin-bottom: 0; color: var(--text); cursor: pointer; }
  #connStatus { font-size: 0.85rem; margin-bottom: 10px; color: var(--muted); }
  #connStatus.ok { color: var(--ok); }
  #connStatus.err { color: var(--err); }
  #receivedArea { min-height: 300px; background: transparent; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Remote Typer</h1>
  <p class="sub" id="subtitle">Paste a paragraph and send it — it will start typing into Notepad on your laptop within a couple of seconds.</p>

  <div class="modeRow">
    <span>This device:</span>
    <label><input type="radio" name="mode" value="send" checked> Sends</label>
    <label><input type="radio" name="mode" value="receive"> Receives</label>
  </div>

  <div class="settingsToggle">
    <button class="secondary" id="settingsBtn" type="button">Settings</button>
  </div>

  <div class="card" id="settingsCard" hidden>
    <h2>Connection</h2>
    <label for="topic">Topic</label>
    <input type="text" id="topic" autocomplete="off" placeholder="e.g. 24crG1T271fS">
    <label for="secret">Secret key</label>
    <input type="password" id="secret" autocomplete="off" placeholder="shared secret from remote_config.json">
    <button id="saveBtn" type="button">Save on this device</button>
  </div>

  <div class="card" id="sendCard">
    <h2>Text to type</h2>
    <textarea id="text" placeholder="Paste your paragraph here..."></textarea>
    <button id="sendBtn" type="button">Send to Notepad</button>
    <div id="status"></div>
  </div>

  <div class="card" id="receiveCard" hidden>
    <h2>Received text</h2>
    <div id="connStatus">Off</div>
    <textarea id="receivedArea" readonly placeholder="Text sent from a laptop will appear here..."></textarea>
    <button class="secondary" id="clearReceivedBtn" type="button" style="width:100%">Clear</button>
  </div>
</div>

<script>
  const topicInput = document.getElementById('topic');
  const secretInput = document.getElementById('secret');
  const settingsCard = document.getElementById('settingsCard');
  const settingsBtn = document.getElementById('settingsBtn');
  const saveBtn = document.getElementById('saveBtn');
  const textArea = document.getElementById('text');
  const sendBtn = document.getElementById('sendBtn');
  const statusEl = document.getElementById('status');
  const subtitle = document.getElementById('subtitle');
  const sendCard = document.getElementById('sendCard');
  const receiveCard = document.getElementById('receiveCard');
  const connStatusEl = document.getElementById('connStatus');
  const receivedArea = document.getElementById('receivedArea');
  const clearReceivedBtn = document.getElementById('clearReceivedBtn');
  const modeRadios = document.querySelectorAll('input[name="mode"]');

  // Same divider convention as the laptop app's Notepad output (see
  // ENTRY_SEPARATOR in main.py) - a full dashed line plus a blank line
  // between entries, since nothing here gets cleared automatically either.
  const ENTRY_SEPARATOR = '\n' + '-'.repeat(40) + '\n\n';

  function loadSettings() {
    topicInput.value = localStorage.getItem('remoteTyperTopic') || '';
    secretInput.value = localStorage.getItem('remoteTyperSecret') || '';
  }
  loadSettings();

  // Open settings automatically on first visit (nothing saved yet), so
  // there's no dead-end screen with a Send button that can't work.
  if (!topicInput.value || !secretInput.value) {
    settingsCard.hidden = false;
  }

  settingsBtn.addEventListener('click', () => {
    settingsCard.hidden = !settingsCard.hidden;
  });

  saveBtn.addEventListener('click', () => {
    localStorage.setItem('remoteTyperTopic', topicInput.value.trim());
    localStorage.setItem('remoteTyperSecret', secretInput.value.trim());
    setStatus('Settings saved on this device.', 'ok');
    settingsCard.hidden = true;
    // Re-apply the current mode so a receiver reconnects with the newly
    // saved topic/secret instead of whatever it started with.
    applyMode();
  });

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = kind || '';
  }

  // ---- mode switch ----

  let eventSource = null;

  function currentMode() {
    return document.querySelector('input[name="mode"]:checked').value;
  }

  function setConnStatus(msg, kind) {
    connStatusEl.textContent = msg;
    connStatusEl.className = kind || '';
  }

  function disconnectReceiver() {
    if (eventSource) {
      eventSource.close();
      eventSource = null;
    }
  }

  function connectReceiver() {
    disconnectReceiver();
    const topic = topicInput.value.trim();
    const secret = secretInput.value.trim();
    if (!topic || !secret) {
      setConnStatus('Set Topic and Secret key in Settings first.', 'err');
      settingsCard.hidden = false;
      return;
    }
    setConnStatus('Connecting...', '');
    eventSource = new EventSource('https://ntfy.sh/' + encodeURIComponent(topic) + '/sse');
    eventSource.onopen = () => setConnStatus('Connected', 'ok');
    eventSource.onerror = () => {
      if (currentMode() === 'receive') setConnStatus('Disconnected — retrying...', 'err');
    };
    // No explicit `event:` field on ntfy's actual message deliveries (only
    // on housekeeping ones like "open"/"keepalive"), so they arrive as the
    // default SSE event type and land here - same reasoning as
    // remote_watch_loop in main.py, which filters on the JSON body's own
    // "event" field rather than the SSE-level event name.
    eventSource.onmessage = (event) => {
      let outer;
      try { outer = JSON.parse(event.data); } catch { return; }
      if (outer.event !== 'message') return;
      let payload;
      try { payload = JSON.parse(outer.message); } catch { return; }
      if (payload.secret !== secret || !payload.text) return;
      appendReceived(payload.text);
    };
  }

  function appendReceived(text) {
    receivedArea.value = receivedArea.value ? receivedArea.value + ENTRY_SEPARATOR + text : text;
    receivedArea.scrollTop = receivedArea.scrollHeight;
  }

  clearReceivedBtn.addEventListener('click', () => {
    receivedArea.value = '';
  });

  function applyMode() {
    const mode = currentMode();
    localStorage.setItem('remoteTyperMode', mode);
    if (mode === 'send') {
      subtitle.textContent = 'Paste a paragraph and send it — it will start typing into Notepad on your laptop within a couple of seconds.';
      sendCard.hidden = false;
      receiveCard.hidden = true;
      disconnectReceiver();
    } else {
      subtitle.textContent = 'Text sent from a laptop appears below as soon as it arrives.';
      sendCard.hidden = true;
      receiveCard.hidden = false;
      connectReceiver();
    }
  }

  modeRadios.forEach((r) => r.addEventListener('change', applyMode));

  const savedMode = localStorage.getItem('remoteTyperMode');
  if (savedMode === 'receive') {
    document.querySelector('input[name="mode"][value="receive"]').checked = true;
  }
  applyMode();

  sendBtn.addEventListener('click', async () => {
    const topic = topicInput.value.trim();
    const secret = secretInput.value.trim();
    const text = textArea.value;

    if (!topic || !secret) {
      setStatus('Set Topic and Secret key in Settings first.', 'err');
      settingsCard.hidden = false;
      return;
    }
    if (!text.trim()) {
      setStatus('Nothing to send — paste some text first.', 'err');
      return;
    }

    sendBtn.disabled = true;
    setStatus('Sending...', '');
    try {
      const body = JSON.stringify({ secret, text });
      const resp = await fetch('https://ntfy.sh/' + encodeURIComponent(topic), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body,
      });
      if (!resp.ok) throw new Error('Relay returned ' + resp.status);
      setStatus('Sent ✓ — check Notepad on your laptop.', 'ok');
      textArea.value = '';
    } catch (err) {
      setStatus('Failed to send: ' + err.message, 'err');
    } finally {
      sendBtn.disabled = false;
    }
  });
</script>
</body>
</html>
